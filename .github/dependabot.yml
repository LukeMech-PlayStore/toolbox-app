# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# GitHub Actions: keeps `uses:` SHA pins current. Gradle: covers gradle/libs.versions.toml,
# the plugins and the wrapper.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
