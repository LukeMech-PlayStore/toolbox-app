# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# GitHub Actions: keeps `uses:` SHA pins current. Gradle: the wrapper alone; the libraries and plugins
# (gradle/libs.versions.toml) are the inspect job's (tests.yml: Android's newer-version inspections fail it), the
# daemon's JVM cron.yml's (its daemon-jvm job).

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "gradle-wrapper"
