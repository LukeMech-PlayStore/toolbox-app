name: Cron

# The repository's upkeep, each job on its own schedule (run by hand: both):
# - durations: the tests' durations (tests.yml's durations.json, how its shards are dealt) live in the Actions cache,
#   which GitHub drops after 7 days unused: restored every 3 days, so a quiet week doesn't lose them. Scheduled runs
#   are main's, so it's main's entry kept, the one every branch reads
# - daemon-jvm: Dependabot doesn't cover gradle/gradle-daemon-jvm.properties: this regenerates it (the newest
#   JDK builds' download links for its toolchainVersion) and opens a PR if it changed

on:
  schedule:
    - cron: "17 4 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durations:
    runs-on: ubuntu-latest
    steps:
      - name: Restore the durations
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: durations.json
          key: e2e-durations-${{ github.run_id }}
          restore-keys: e2e-durations-

      - name: None yet
        if: ${{ steps.restore.outputs.cache-matched-key == '' }}
        run: echo "::notice ::No durations cached yet (tests.yml's report job saves them)"

  daemon-jvm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Gradle's home as main's runs left it (its distribution, at least)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # Same Java version as now; bump it with --jvm-version by hand
      - name: Regenerate the daemon JVM criteria
        run: |
          version=$(sed -n 's/^toolchainVersion=//p' gradle/gradle-daemon-jvm.properties)
          chmod +x ./gradlew
          ./gradlew --build-cache updateDaemonJvm --jvm-version="$version"

      - name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update/gradle-daemon-jvm
          delete-branch: true
          add-paths: gradle/gradle-daemon-jvm.properties
          commit-message: Update the Gradle Daemon JVM download links
          title: Update the Gradle Daemon JVM download links
          body: |
            `./gradlew updateDaemonJvm` regenerated `gradle/gradle-daemon-jvm.properties`: the links to
            the newest builds of its JDK, downloaded where no matching one is installed.
