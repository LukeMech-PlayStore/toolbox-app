name: Android Build & Release

env:
  packageName: org.lukemech.lmtoolbox

on:
  # A version's tag (v75_26.10.22: the Play version code first): the release, as drafts to internal and alpha, internal's published
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_debug:
        description: "Build Debug APK"
        required: true
        default: false
        type: boolean
      build_release:
        description: "Build Signed Release APK & Bundle"
        required: true
        default: true
        type: boolean
      # No track: the release is built, not uploaded to Play
      track_internal:
        description: "Push to track: internal"
        default: true
        type: boolean
      track_alpha:
        description: "Push to track: alpha"
        default: false
        type: boolean
      auto_publish:
        description: "Publish the drafts once uploaded (the tracks above; see publish-draft.yml)"
        required: true
        default: false
        type: boolean


jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.settings.outputs.publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What to build and where it goes: a tag's release as above, else as picked
      - name: Settings
        id: settings
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            debug=false; release=true; tracks=(internal alpha); publish=internal
          else
            debug="${{ inputs.build_debug }}"; release="${{ inputs.build_release }}"
            tracks=()
            [[ "${{ inputs.track_internal }}" == "true" ]] && tracks+=(internal)
            [[ "${{ inputs.track_alpha }}" == "true" ]] && tracks+=(alpha)
            publish=""
            [[ "${{ inputs.auto_publish }}" == "true" ]] && publish="$(IFS=,; echo "${tracks[*]}")"
          fi
          # Nothing to publish without a release uploaded
          [[ "$release" != "true" ]] && { tracks=(); publish=""; }
          # The version from the tag (v<gplayCode>_<versionName>, e.g. v76_26.10.24), passed to Gradle. Run by hand
          # on a branch, there's none: the build is named as a local one (<YY.MM.DD>-b<n>, version code 1, buildSrc's
          # AppVersion.kt), which Play won't take
          version_args=""
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)_(.+)$ ]]; then
              echo "::error ::Tag $GITHUB_REF_NAME isn't v<gplayCode>_<versionName>"; exit 1
            fi
            version_args="-PgplayCode=${BASH_REMATCH[1]} -PversionName=${BASH_REMATCH[2]}"
          elif [[ ${#tracks[@]} -gt 0 ]]; then
            echo "::error ::Uploading to Play needs a version: run this on a version's tag (v<gplayCode>_<versionName>)"; exit 1
          fi
          echo "version_args=$version_args" >> $GITHUB_OUTPUT
          echo "debug=$debug" >> $GITHUB_OUTPUT
          echo "release=$release" >> $GITHUB_OUTPUT
          echo "tracks=$(IFS=,; echo "${tracks[*]}")" >> $GITHUB_OUTPUT
          echo "publish=$publish" >> $GITHUB_OUTPUT

      # No setup-java: the foojay toolchain resolver (settings.gradle.kts) provisions
      # the toolchain JDK (gradle.properties); the runner's default JDK runs Gradle.
      # Gradle's home and build cache as main's runs left them (tests.yml keeps them): a tag's release reads
      # them, only runs on main write them
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # The app is tested on emulators by tests.yml (every pull request and push to main)

      - name: Build Debug APK
        if: ${{ steps.settings.outputs.debug == 'true' }}
        run: |
          chmod +x ./gradlew
          ./gradlew --build-cache assembleDebug ${{ steps.settings.outputs.version_args }}

      - name: Decode keystore from GitHub secrets
        if: ${{ steps.settings.outputs.release == 'true' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > toolboxKeystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Signed Release APK & Bundle
        if: ${{ steps.settings.outputs.release == 'true' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --build-cache assembleRelease bundleRelease ${{ steps.settings.outputs.version_args }} \
            -Pandroid.injected.signing.store.file=$(pwd)/toolboxKeystore.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"


      - name: Zip Native Debug Symbols, add Mapping File and whatsNew files
        if: ${{ steps.settings.outputs.release == 'true' }}
        run: |
          set -e
          mkdir -p app/build/outputs/bundle/release/whatsNew/
          cp -r whatsNew/* app/build/outputs/bundle/release/whatsNew/
          cp app/build/outputs/mapping/release/mapping.txt app/build/outputs/bundle/release
          LIB_PATH=$(find app/build/intermediates/merged_native_libs/release -type d -path "*/out/lib" | head -n 1)
          if [ -z "$LIB_PATH" ]; then echo "❌ Native symbol folder not found."; exit 1; fi
          ZIP_TARGET="$GITHUB_WORKSPACE/app/build/outputs/bundle/release/native-debug-symbols.zip"
          cd "$LIB_PATH"
          # Not the package archives (*.tar.xz.so) nor their list (libparts.json.so): named .so only to be unpacked with the libraries
          zip -r "$ZIP_TARGET" . -x "*.tar.xz.so" -x "*/libparts.json.so"

      - name: Prepare files for Play Store Release
        if: ${{ steps.settings.outputs.release == 'true' }}
        run: |
          mkdir -p release/
          cp -r app/build/outputs/bundle/release/* release/
          if [[ -z "${{ steps.settings.outputs.tracks }}" ]]; then
            echo "::notice ::No Play Store track selected: not uploading to Play"
          fi

      # Before the Play upload, so the files are there for a manual upload if it fails
      - name: Upload release files as artifact
        if: ${{ steps.settings.outputs.release == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release
          path: |
            release/*.aab
            release/mapping.txt
            release/native-debug-symbols.zip
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK as artifact
        if: ${{ steps.settings.outputs.debug == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Always as drafts: published (if asked) by the job that publishes them, publish-draft.yml
      - name: Upload Release to Play Store
        if: ${{ steps.settings.outputs.tracks != '' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          releaseFiles: release/*.aab
          debugSymbols: release/native-debug-symbols.zip
          mappingFile: release/mapping.txt
          packageName: ${{ env.packageName }}
          whatsNewDirectory: release/whatsNew/
          tracks: ${{ steps.settings.outputs.tracks }}
          status: draft

  publish:
    needs: build
    if: ${{ needs.build.outputs.publish != '' }}
    uses: ./.github/workflows/publish-draft.yml
    with:
      tracks: ${{ needs.build.outputs.publish }}
    secrets:
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}

  # A tag's GitHub release, once it's built: titled by the tag, the English release notes, then the
  # commits since the previous tag. No APK nor bundle attached: builds are on Google Play
  github-release:
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Write the release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          # The first tag: every commit up to it
          prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          {
            cat whatsNew/whatsnew-en-US
            echo
            echo
            echo "## Commits"
            echo
            git log --no-merges --format="- %s (%h)" "${prev:+$prev..}$tag"
            if [[ -n "$prev" ]]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/$prev...$tag"
            fi
          } > release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
