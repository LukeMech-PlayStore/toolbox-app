name: Update Gradle Daemon JVM

# Dependabot doesn't cover gradle/gradle-daemon-jvm.properties: this regenerates it weekly (the
# newest JDK builds' download links for its toolchainVersion) and opens a PR if it changed.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup gradle cache
        uses: burrunan/gradle-cache-action@404534c34a2faa40430357a3183522a845b04f3b # v3.0.3

      # Same Java version as now; bump it with --jvm-version by hand
      - name: Regenerate the daemon JVM criteria
        run: |
          version=$(sed -n 's/^toolchainVersion=//p' gradle/gradle-daemon-jvm.properties)
          ./gradlew --no-daemon updateDaemonJvm --jvm-version="$version"

      - name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update/gradle-daemon-jvm
          delete-branch: true
          add-paths: gradle/gradle-daemon-jvm.properties
          commit-message: Update the Gradle Daemon JVM download links
          title: Update the Gradle Daemon JVM download links
          body: |
            `./gradlew updateDaemonJvm` regenerated `gradle/gradle-daemon-jvm.properties`: the links to
            the newest builds of its JDK, downloaded where no matching one is installed.
