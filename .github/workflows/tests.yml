name: Tests

# End-to-end tests: the app on emulators, every tool opened and gone through (app/src/androidTest). Legs: the oldest
# Android the app supports (minSdk), the one it targets (targetSdk) and the newest canary (16 KB pages), on x86_64 and
# x86 (ARM translated on GitHub's runners can't run the Linux subsystem), each split into shards. Every run tests
# everything, e.g. a Minecraft server on every Java and every loader.
#
# Alongside them, the code is inspected as Android Studio's Inspect Code does. Results:
# - the run's summary: every test on every leg (report job), every inspection problem (inspect job)
# - annotations: failed tests (merge.py)
# - artifacts: screenshots, logcat, raw results, Qodana's HTML report
# - on a pull request: both summaries in one comment, updated by every run, the failed tests' screenshots and logcat
#   in it (comment job)
#
# Jobs: plan, build and inspect start at once; test needs plan and build; report needs test; comment needs report
# and inspect. linux-release, on its own, fails while the subsystem pinned is a pull request's build.
#
# A pull request changing the subsystem too (e.g. a tool and the packages it runs) pins that pull request's build:
# linuxRelease=pr-<number> in gradle.properties, the artifact of the subsystem's newest successful build of its head
# (buildSrc's LinuxPackages.kt; read with the SUBSYSTEM_TOKEN secret). Its tests run with that build; re-run them
# after a push there. Once the subsystem's pull request is merged and released, pin the release (./gradlew
# updateLinuxRelease): until then linux-release fails, so it isn't merged with a build that's no release.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# actions: the durations earlier runs kept (their artifacts, see plan)
permissions:
  contents: read
  actions: read

jobs:
  # The legs and their shards (matrix.py), and how long each test took last time, for dealing tests among shards
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plan the legs
        id: matrix
        run: echo "matrix=$(python3 .github/scripts/tests/e2e/matrix.py gradle.properties)" >> "$GITHUB_OUTPUT"

      # The newest durations this branch can see (its pull request's runs', else main's), taken once for the whole run:
      # every shard of a leg must deal the tests from the same file, or some would run twice and others not at all.
      # Each run that updated them keeps them as its artifact (durations, the report job's). None yet: tests are
      # dealt by their order alone.
      - name: Take the durations
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # <branch> <which of its runs (jq)>: its newest run's that kept them
          take() {
            local id
            for id in $(gh run list -R "$GITHUB_REPOSITORY" -w tests.yml -b "$1" -L 20 --json databaseId,event \
              --jq ".[] | select(.databaseId != $GITHUB_RUN_ID and ($2)) | .databaseId"); do
              if gh run download "$id" -R "$GITHUB_REPOSITORY" -n durations -D . 2>/dev/null; then
                echo "Durations of run $id"
                return 0
              fi
            done
            return 1
          }
          if [ -n "$HEAD_REF" ] && take "$HEAD_REF" '.event == "pull_request"'; then exit 0; fi
          take main '.event != "pull_request"' || echo "No durations yet: tests are dealt by their order"

      - name: Upload the durations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-durations
          path: durations.json
          if-no-files-found: ignore
          retention-days: 3

  # The subsystem pinned (gradle.properties' linuxRelease): a release, not a pull request's build. Tested with one, a
  # pull request can't be merged so (see above); which one is said in the run's summary.
  linux-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the pinned subsystem
        run: |
          linux=$(sed -n 's/^linuxRelease=//p' gradle.properties | tr -d '\r')
          repo=https://github.com/LukeMech-PlayStore/toolbox-linux-subsystem
          if [[ "$linux" == pr-* ]]; then
            echo "Subsystem: the pull request's build, [#${linux#pr-}]($repo/pull/${linux#pr-})." >> "$GITHUB_STEP_SUMMARY"
            echo "::error file=gradle.properties::linuxRelease=$linux is the subsystem's pull request's build: once it's merged and released, pin the release (./gradlew updateLinuxRelease)"
            exit 1
          fi
          echo "Subsystem: release [$linux]($repo/releases/tag/$linux)." >> "$GITHUB_STEP_SUMMARY"

  # The debug bundle and the tests' APK, built once for every leg
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-java: the foojay toolchain resolver provides the JDK (as in build-app.yml). Gradle's home and build
      # cache are cached as in every workflow here; pull requests write them too, so the next push reuses them. No
      # Gradle job summary: it would sit above the tests' report.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: false
          add-job-summary: never

      # Version name: the tested commit's short hash (a pull request's head, not its merge commit). Version code 1:
      # not a release (build-app.yml's come from tags).
      # SUBSYSTEM_TOKEN: a subsystem's pull request's build pinned is an artifact, which GitHub's API gives only with a
      # token reading that repository's actions (this run's own reads only this one)
      - name: Build the debug bundle and the tests
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SUBSYSTEM_TOKEN: ${{ secrets.SUBSYSTEM_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew --build-cache :app:bundleDebug :app:assembleDebugAndroidTest \
            -PversionName="${COMMIT::7}" -PgplayCode=1

      # With the bundletool version installLocalTesting uses (buildSrc's LocalTesting.kt), so each leg installs the
      # app as a developer's phone does
      - name: Collect
        run: |
          mkdir dist
          cp app/build/outputs/bundle/debug/app-debug.aab dist/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/
          version=$(sed -n 's/.*BUNDLETOOL_VERSION = "\(.*\)".*/\1/p' buildSrc/src/main/kotlin/LocalTesting.kt)
          curl -sSfL -o dist/bundletool.jar \
            "https://github.com/google/bundletool/releases/download/$version/bundletool-all-$version.jar"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build
          path: dist/
          if-no-files-found: error
          retention-days: 3

  # The code inspected as Android Studio's Inspect Code does: IntelliJ's and Android's inspections with the project's
  # profile (.idea/inspectionProfiles), in Qodana Community for Android (no token, no Qodana Cloud). Reported as soon as
  # it's done (report.py); fails on critical and high problems. The image is pulled at :latest on every run (Dependabot
  # doesn't update container images), so the inspections stay as current as the IDE's.
  inspect:
    runs-on: ubuntu-latest
    container:
      image: jetbrains/qodana-jvm-android:latest
      # The runner's Android SDK: the image has only android-33
      volumes:
        - /usr/local/lib/android/sdk:/data/android-sdk
      env:
        ANDROID_HOME: /data/android-sdk
        ANDROID_SDK_ROOT: /data/android-sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Qodana only syncs the project, so code using BuildConfig would be unresolved and left uninspected. The Linux
      # packages aren't needed here. Qodana's sync then reuses this Gradle home, so dependencies download once.
      - name: Generate BuildConfig
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:generateDebugBuildConfig -x :app:updateLinuxPackages

      # Plugins the IDE has and the image lacks, installed by Qodana from qodana.yaml: Jetpack Compose (without it,
      # Kotlin's naming inspection flags every @Composable) and Android Design Tools (the profile's preview inspections).
      # The profile itself is passed on the command line.
      - name: Inspect
        run: |
          cat > qodana.yaml <<'EOF'
          version: "1.0"
          plugins:
            - id: androidx.compose.plugins.idea
            - id: com.android.tools.design
          EOF
          qodana --project-dir "$GITHUB_WORKSPACE" --results-dir /tmp/inspections \
            --profile-path .idea/inspectionProfiles/Project_Default.xml --save-report

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inspections
          path: /tmp/inspections/
          if-no-files-found: warn
          retention-days: 14

      # The summary, also kept for the pull request's comment. The image has no Python.
      - name: Report
        if: always()
        run: |
          apt-get update -qq && apt-get install -y -qq python3 > /dev/null
          status=0
          python3 .github/scripts/tests/inspections/report.py /tmp/inspections/qodana.sarif.json inspections.md || status=$?
          cat inspections.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summary-inspections
          path: inspections.md
          if-no-files-found: ignore
          retention-days: 3

  # One job per shard (matrix.py): the app installed and its tests run on an emulator (run-tests.sh)
  test:
    needs: [plan, build]
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build
          path: dist

      # None yet: nothing to download
      - name: Download the durations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: e2e-durations

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_LEG: ${{ matrix.name }}
          E2E_SHARD: ${{ matrix.shard }}
          E2E_SHARDS: ${{ matrix.shards }}
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.image }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          channel: ${{ matrix.channel }}
          cores: 4
          # Half the runner's 16 GB: with 4 GB, the canary's low-memory killer took the app while the system started
          # up. x86 gets 4 GB, all a 32-bit system uses. The app's Java heap is set by run-tests.sh, not heap-size.
          ram-size: ${{ matrix.arch == 'x86' && '4096M' || '8192M' }}
          # Room for the Java versions and the servers' worlds
          disk-size: 16G
          emulator-boot-timeout: 900
          # The action's defaults plus reading color buffers by DMA. Android 37.0's graphics (mapper.ranchu) only copies
          # them that way and crashes without it ("!rcEnc->featureInfo()->hasReadColorBufferDma"), taking system_server
          # and every test after it down; the runners' emulator (37.2) offers it only with both features on.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
            -feature GLDirectMem,HasSharedSlotsHostMemoryAllocator
          disable-animations: true
          script: bash .github/scripts/tests/e2e/run-tests.sh

      - name: Upload screenshots, logcat and raw results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.id }}
          path: e2e-results/
          if-no-files-found: warn
          retention-days: 14

  # Every shard's results in one report (merge.py): the summary, failed tests as annotations, what they left for the
  # pull request's comment (their screenshots and logcat), and the job failed if a test failed or didn't run
  report:
    needs: [plan, test]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      failures-url: ${{ steps.failures.outputs.artifact-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-results-*
          path: e2e-results

      # The durations the shards used, updated by merge.py with this run's
      - name: Download the durations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: e2e-durations

      # The summary and the failures also kept for the pull request's comment
      - name: Report
        id: report
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          status=0
          python3 .github/scripts/tests/e2e/merge.py "$MATRIX" e2e-results e2e.md durations.json failures || status=$?
          cat e2e.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summary-e2e
          path: e2e.md
          if-no-files-found: ignore
          retention-days: 3

      # None when nothing failed. The comment links it: a comment can't hold files (GitHub's API has no uploads for them)
      - name: Upload the failures
        id: failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures
          path: failures/
          if-no-files-found: ignore
          retention-days: 3

      # For the next runs' shards (plan takes the newest): kept as long as GitHub keeps artifacts, so a quiet month
      # doesn't lose them. A pull request's durations are read by its own runs, main's by every branch's. Kept only
      # if merge.py updated them (almost nothing failed) and the run wasn't canceled (cut-short shards would be
      # missing tests).
      - name: Keep the durations
        if: >-
          always() && !cancelled() && needs.test.result != 'cancelled'
          && steps.report.outputs.durations == 'updated'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: durations
          path: durations.json
          retention-days: 90

  # On a pull request: both summaries in one comment (comment.py), whatever the jobs came to, the failed tests' logcat
  # errors in it (their screens and whole logcat in the failures' artifact, linked). Every run updates the same comment, found by its hidden marker. Skipped when the run is canceled
  # (a newer one comments instead) and for forks' and Dependabot's pull requests (their token can't comment).
  comment:
    needs: [report, inspect]
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A job that didn't get to write its summary has none; its line in the comment says so
      - name: Download the summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: summary-*
          path: summaries
          merge-multiple: true

      # None when nothing failed
      - name: Download the failures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: e2e-failures
          path: failures

      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          E2E_RESULT: ${{ needs.report.result }}
          INSPECT_RESULT: ${{ needs.inspect.result }}
          FAILURES_URL: ${{ needs.report.outputs.failures-url }}
        run: |
          python3 .github/scripts/tests/comment.py summaries/e2e.md summaries/inspections.md comment.md failures
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- lmtoolbox-tests -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
