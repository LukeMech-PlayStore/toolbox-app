name: End-to-end tests

# The app on emulators, every tool opened and gone through (app/src/androidTest): on the oldest Android it
# supports (minSdk), the one it targets (targetSdk) and the newest there is (canary, 16 KB pages), for each ABI it
# ships. Failures come as annotations on the PR and in the job's summary (JUnit XML, mikepenz/action-junit-report);
# screenshots and logcat as artifacts. Every run tests everything: a Minecraft server on every Java, every loader.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Once for every leg: the debug bundle, the tests' APK and the key both are signed with
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-java: the foojay toolchain resolver provisions the JDK (as in build-app.yml)
      - name: Setup gradle cache
        uses: burrunan/gradle-cache-action@404534c34a2faa40430357a3183522a845b04f3b # v3.0.3

      - name: Build the debug bundle and the tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:bundleDebug :app:assembleDebugAndroidTest

      - name: Collect
        run: |
          mkdir dist
          cp app/build/outputs/bundle/debug/app-debug.aab dist/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/
          # The key Gradle signed both with: the legs sign the bundle's APKs with it too, or the tests can't instrument the app
          cp ~/.android/debug.keystore dist/
          # The bundletool installLocalTesting uses (buildSrc's LocalTesting.kt): installed as on a developer's phone
          version=$(sed -n 's/.*BUNDLETOOL_VERSION = "\(.*\)".*/\1/p' buildSrc/src/main/kotlin/LocalTesting.kt)
          curl -sSfL -o dist/bundletool.jar \
            "https://github.com/google/bundletool/releases/download/$version/bundletool-all-$version.jar"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build
          path: dist/
          if-no-files-found: error
          retention-days: 3

  test:
    needs: build
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    # The ARM legs run under emulation, which the emulator may not offer on an x86_64 host: tried, never failing the run
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: x86_64-api29, name: "x86_64 · API 29 (min)", arch: x86_64, api: "29", target: google_apis, channel: stable, experimental: false }
          - { id: x86_64-api37, name: "x86_64 · API 37 (target)", arch: x86_64, api: "37.0", target: google_apis, channel: stable, experimental: false }
          - { id: x86_64-canary, name: "x86_64 · canary (newest, 16 KB pages)", arch: x86_64, api: CANARY, target: google_apis_ps16k, channel: canary, experimental: false }
          # x86: its images end with API 30
          - { id: x86-api29, name: "x86 · API 29 (min)", arch: x86, api: "29", target: google_apis, channel: stable, experimental: false }
          - { id: x86-api30, name: "x86 · API 30 (newest x86 image)", arch: x86, api: "30", target: google_apis, channel: stable, experimental: false }
          - { id: arm64-api29, name: "arm64-v8a · API 29 (min)", arch: arm64-v8a, api: "29", target: google_apis, channel: stable, experimental: true }
          - { id: arm64-api37, name: "arm64-v8a · API 37 (target)", arch: arm64-v8a, api: "37.0", target: google_apis, channel: stable, experimental: true }
          - { id: arm64-canary, name: "arm64-v8a · canary (newest)", arch: arm64-v8a, api: CANARY, target: google_apis_ps16k, channel: canary, experimental: true }
          # armeabi-v7a: no image newer than API 25 (the app needs 29); installed as 32-bit on a 64-bit ARM one that runs it
          - { id: armv7-api29, name: "armeabi-v7a · API 29 (min, on arm64)", arch: arm64-v8a, api: "29", target: google_apis, channel: stable, experimental: true, force_abi: armeabi-v7a }
          - { id: armv7-api37, name: "armeabi-v7a · API 37 (target, on arm64)", arch: arm64-v8a, api: "37.0", target: google_apis, channel: stable, experimental: true, force_abi: armeabi-v7a }
          - { id: armv7-canary, name: "armeabi-v7a · canary (newest, on arm64)", arch: arm64-v8a, api: CANARY, target: google_apis_ps16k, channel: canary, experimental: true, force_abi: armeabi-v7a }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p ~/.android && cp dist/debug.keystore ~/.android/debug.keystore

      - name: Run the tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_LEG: ${{ matrix.name }}
          FORCE_ABI: ${{ matrix.force_abi }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          channel: ${{ matrix.channel }}
          cores: 4
          ram-size: 4096M
          # The Java versions and the servers' worlds take room
          disk-size: 16G
          emulator-boot-timeout: ${{ matrix.experimental && 1800 || 900 }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash .github/scripts/e2e/run-tests.sh

      - name: Report
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: e2e-results/junit/*.xml
          check_name: "E2E · ${{ matrix.name }}"
          # A fork's pull request can't make check runs: annotations alone
          annotate_only: ${{ github.event.pull_request.head.repo.fork == true }}
          job_summary: true
          detailed_summary: true
          include_passed: false
          require_tests: true
          # A failed test is run once more (instrument.py): passing then, it's flaky, not failed
          check_retries: true
          fail_on_failure: true

      - name: Upload screenshots, logcat and raw results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.id }}
          path: e2e-results/
          if-no-files-found: warn
          retention-days: 14
