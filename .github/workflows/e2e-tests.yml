name: End-to-end tests

# The app on emulators, every tool opened and gone through (app/src/androidTest): on the oldest Android it
# supports (minSdk), the one it targets (targetSdk) and the newest there is (canary, 16 KB pages), for each ABI it
# ships. Failures come as annotations on the PR and in the job's summary (JUnit XML, mikepenz/action-junit-report);
# screenshots and logcat as artifacts. Every run tests everything: a Minecraft server on every Java, every loader.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Once for every leg: the debug bundle and the tests' APK (each leg signs both with a key of its own)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-java: the foojay toolchain resolver provisions the JDK (as in build-app.yml). Gradle's own home
      # cached (its distribution, the dependencies, the libraries already dexed) and its build cache (the tasks'
      # outputs), as every workflow here sets it up; pull requests' runs write them too, so the next push reuses them
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Build the debug bundle and the tests
        run: |
          chmod +x ./gradlew
          ./gradlew --build-cache :app:bundleDebug :app:assembleDebugAndroidTest

      - name: Collect
        run: |
          mkdir dist
          cp app/build/outputs/bundle/debug/app-debug.aab dist/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/
          # The bundletool installLocalTesting uses (buildSrc's LocalTesting.kt): installed as on a developer's phone
          version=$(sed -n 's/.*BUNDLETOOL_VERSION = "\(.*\)".*/\1/p' buildSrc/src/main/kotlin/LocalTesting.kt)
          curl -sSfL -o dist/bundletool.jar \
            "https://github.com/google/bundletool/releases/download/$version/bundletool-all-$version.jar"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build
          path: dist/
          if-no-files-found: error
          retention-days: 3

  # The legs: x86_64 and x86 on the app's oldest Android, its target and the newest canary, as Google's images are
  # now (x86's newest instead of the last two), and ARM translated on x86_64's: see matrix.py, in the scripts'
  # e2e-tests folder
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plan the legs
        id: matrix
        run: echo "matrix=$(python3 .github/scripts/e2e-tests/matrix.py gradle.properties)" >> "$GITHUB_OUTPUT"

  test:
    needs: [plan, build]
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # The ARM legs (the app under Google's ARM translator): tried, never failing the run
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_LEG: ${{ matrix.name }}
          FORCE_ABI: ${{ matrix.force_abi }}
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.image }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          channel: ${{ matrix.channel }}
          cores: 4
          ram-size: 4096M
          # The Java versions and the servers' worlds take room
          disk-size: 16G
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/e2e-tests/run-tests.sh

      - name: Report
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: e2e-results/junit/*.xml
          check_name: "E2E · ${{ matrix.name }}"
          # A fork's pull request can't make check runs: annotations alone
          annotate_only: ${{ github.event.pull_request.head.repo.fork == true }}
          job_summary: true
          detailed_summary: true
          include_passed: false
          require_tests: true
          # A failed test is run once more (instrument.py): passing then, it's flaky, not failed
          check_retries: true
          fail_on_failure: true

      - name: Upload screenshots, logcat and raw results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.id }}
          path: e2e-results/
          if-no-files-found: warn
          retention-days: 14
