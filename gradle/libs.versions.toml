[versions]
kotlin = "2.4.21"
agp = "9.1.1"
coroutines = "1.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.19.1" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.13.0" }
# The image resizer copies a picture's EXIF over: into PNGs and WebPs too on every Android (its own: from 11)
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version = "1.4.2" }
androidx-core-location-altitude = { group = "androidx.core", name = "core-location-altitude", version = "1.0.1" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version = "2.10.2" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version = "2026.09.00" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

xz = { group = "org.tukaani", name = "xz", version = "1.12" }

# Tools whose programs come as on-demand Play modules (features/)
play-feature-delivery = { group = "com.google.android.play", name = "feature-delivery-ktx", version = "2.1.0" }
# Its own dependencies, newer than the ones its 2023 release asks for (Play flagged its fragment 1.1.0);
# constraints only (app's build file): not used directly
androidx-fragment = { group = "androidx.fragment", name = "fragment", version = "1.9.1" }
play-services-basement = { group = "com.google.android.gms", name = "play-services-basement", version = "18.12.0" }
play-services-tasks = { group = "com.google.android.gms", name = "play-services-tasks", version = "18.4.1" }
play-core-common = { group = "com.google.android.play", name = "core-common", version = "2.0.4" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { group = "junit", name = "junit", version = "4.13.2" }
org-json = { group = "org.json", name = "json", version = "20260814" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-dynamic-feature = { id = "com.android.dynamic-feature", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
